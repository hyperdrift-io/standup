[project]
name = "standup-agent"
version = "0.3.0"
description = "Type a GitHub handle. See who is waiting on you, what will hurt later, and what to do first."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["github", "maintainers", "open-source", "strands-agents", "mcp", "agent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
  "strands-agents[gemini]>=1.54.0",
  "google-auth>=2.30.0",
  "httpx>=0.28",
  "pydantic>=2",
  # mcp 2.x renamed FastMCP; stay on 1.x until the server is ported
  "mcp>=1.29,<2",
  "starlette>=1.0",
  "uvicorn>=0.30",
  "sse-starlette>=3",
  "python-multipart>=0.0.20",
  # PM2 (interpreter: none) starts the interpreter directly and does not source .env;
  # the web entrypoint loads it itself.
  "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://standup.hyperdrift.io"
Repository = "https://github.com/hyperdrift-io/standup"
Article = "https://hyperdrift.io/blog/one-evening-who-is-waiting-on-you"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
standup = "standup.cli:main"
standup-mcp = "standup.mcp_server:main"
standup-web = "standup.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/standup"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:starlette.testclient"]
