[project]
name = "handover"
version = "0.1.0"
description = "What to do first when you come back to a project you left."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "strands-agents>=1.54.0",
  "strands-agents[gemini]>=1.54.0",
  "google-auth>=2.30.0",
]

[project.scripts]
handover = "handover.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/handover"]
