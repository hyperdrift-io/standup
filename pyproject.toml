[project]
name = "standup"
version = "0.2.0"
description = "Type a GitHub handle. See who is waiting on you, what will hurt later, and what to do first."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "strands-agents[gemini]>=1.54.0",
  "google-auth>=2.30.0",
  "httpx>=0.28",
  "pydantic>=2",
  # mcp 2.x renamed FastMCP; stay on 1.x until the server is ported
  "mcp>=1.29,<2",
  "starlette>=1.0",
  "uvicorn>=0.30",
  "sse-starlette>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
standup = "standup.cli:main"
standup-mcp = "standup.mcp_server:main"
standup-web = "standup.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/standup"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
